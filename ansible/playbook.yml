---
- name: Preparar servidores Docker primary e standby
  hosts: app
  become: true
  vars:
    docker_packages:
      - docker.io
      - awscli
      - jq

  tasks:
    - name: Atualizar lista de pacotes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar dependências
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Garantir que Docker está ativo
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Adicionar ubuntu ao grupo docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true
